<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - QR Verify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }
        
        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 1.5rem;
        }
        
        .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            margin: 0 0.5rem;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            color: white !important;
            transform: translateY(-2px);
        }
        
        .resume-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            margin: 0 auto;
        }
        
        .resume-header {
            text-align: center;
            border-bottom: 2px solid #667eea;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .resume-name {
            color: #333;
            font-size: 2rem;
            font-weight: bold;
        }
        
        .resume-contact {
            color: #666;
            margin-top: 0.5rem;
        }
        
        .resume-section {
            margin-bottom: 1.5rem;
        }
        
        .section-title {
            color: #667eea;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .section-content {
            color: #333;
            line-height: 1.6;
        }
        
        .qr-section {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid #667eea;
        }
        
        .qr-code {
            max-width: 150px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-qrcode me-2"></i>QR Verify
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">
                            <i class="fas fa-home me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'student_register' %}">
                            <i class="fas fa-user-plus me-1"></i> Register
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'recruiter_login' %}">
                            <i class="fas fa-briefcase me-1"></i> Recruiter
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="resume-card">
        <div class="resume-header">
            <h1 class="resume-name">{{ resume.student.name }}</h1>
            <p class="resume-contact">
                <i class="fas fa-envelope me-2"></i>{{ resume.student.email }}
                <span class="mx-2">|</span>
                <i class="fas fa-phone me-2"></i>{{ resume.student.mobile_number }}
                <span class="mx-2">|</span>
                <i class="fas fa-id-card me-2"></i>{{ resume.student.roll_number }}
            </p>
        </div>
        
        <div class="mt-4">
            <h5 class="text-muted mb-2">Resume Preview</h5>
            <embed src="{{ resume.file.url }}" type="application/pdf" width="100%" height="400" style="border-radius: 10px; border: 2px solid #667eea;">
        </div>
        
        <div class="text-center mt-4">
            <a href="{{ resume.file.url }}" class="btn btn-download" download>
                <i class="fas fa-download me-2"></i>Download Resume
            </a>
        </div>
        
        <div class="qr-section">
            <h5 class="text-muted mb-3">Scan to View Certificates (QR-C)</h5>
            {% if resume.qr_certificates %}
                <img src="{{ resume.qr_certificates.url }}" alt="Certificate QR" class="qr-code">
            {% endif %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
